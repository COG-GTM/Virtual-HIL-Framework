name: SIL CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv pip install -e .

      - name: Start ECU Simulator
        run: |
          uv run vhil-start start
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          cat logs/*.log
          exit 1

      - name: Run unit tests
        run: uv run --extra dev pytest tests/unit -v --junitxml=reports/pytest.xml

      - name: Run Robot Framework tests
        if: success() || failure()
        run: uv run robot --outputdir reports --xunit xunit.xml tests/functional/

      - name: Stop ECU Simulator
        if: always()
        run: uv run vhil-start stop || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            logs/
